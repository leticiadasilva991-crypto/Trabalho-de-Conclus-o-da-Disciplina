name: Execução por push

on:
  push:
    branches: [main]

jobs:
  execucao-teste:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - run: npm test
        continue-on-error: true

      - name: Install Mocha
        run: npm install mocha
        continue-on-error: true

      - name: Run tests and generate output report
        run: npx mocha --reporter json --reporter-option output=test-results.json
        continue-on-error: true

      - uses: actions/upload-artifact@v4  # upload test results
        name: Upload artifacts
        if: always()
        continue-on-error: true
        with:
          name: test-results
          path: test-results.json

      - uses: dorny/test-reporter@v2
        name: Publish test results
        if: always()
        continue-on-error: true
        with:
          artifact: test-results
          name: Mocha Tests
          path: 'test-results.json'
          reporter: mocha-json

      - name: Executar testes e gerar relatório HTML
        run: |
          npx mocha test/servicospagamento.test.js \
            --reporter mochawesome \
            --reporter-options reportDir=mochawesome-report,reportFilename=index
        continue-on-error: true

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mochawesome-report
          path: mochawesome-report/